# /etc/tlp.d/00-battery.conf
# ThinkPad X230 Battery Care & Power Saving Optimizations

# 1. Battery Charge Thresholds (maximizes Li-Ion battery lifespan)
# Main battery (BAT0): start charging below 75%, stop at 85%
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=85

# Secondary / Slice battery (BAT1), if installed
START_CHARGE_THRESH_BAT1=75
STOP_CHARGE_THRESH_BAT1=85

# 2. Radio Devices on Startup (saves ~1.5W idle power)
# Automatically disables Bluetooth and legacy 3G/WWAN module on boot.
# Note: Remove "bluetooth" below if you want the Broadcom BDC-4.0 adapter active on boot.
DEVICES_TO_DISABLE_ON_STARTUP="bluetooth wwan"

# 3. PCIe Active State Power Management (ASPM)
# Enables deep CPU package C-states (C6/C7) on battery (~0.6 - 0.8W savings)
PCIE_ASPM_ON_AC="default"
PCIE_ASPM_ON_BAT="powersupersave"
